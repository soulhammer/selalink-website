name: Deploy Astro site to GitHub Pages

on:
  # 매번 main 브랜치에 코드가 푸시(push)될 때마다 자동으로 빌드 및 배포를 실행합니다.
  push:
    branches: ["main"]
  # (필요시) GitHub Actions 탭에서 수동으로 배포 버튼을 누를 수 있게 해줍니다.
  workflow_dispatch:

# GitHub Pages 배포를 위해 필요한 권한(Permission) 설정
permissions:
  contents: read
  pages: write
  id-token: write

# 동일한 배포가 동시에 여러 개 실행되는 것을 방지합니다.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    name: "🛠️ Astro 프로젝트 빌드"
    runs-on: ubuntu-latest
    steps:
      - name: 📦 저장소(레포지토리) 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 1 # 최신 커밋 초고속 체크아웃

      - name: 🟢 Node.js 22버전 환경 셋팅
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "./apps/studio/package-lock.json"

      - name: 🔑 구글 Indexing API 서비스 계정 인증 파일 임시 생성
        run: |
          mkdir -p apps/studio/secrets
          echo '${{ secrets.GOOGLE_SERVICE_KEY }}' > apps/studio/secrets/google-service-key.json

      - name: ⚡ Astro 빌드 에셋 캐싱 복원 및 저장 (.astro 및 node_modules)
        uses: actions/cache@v4
        with:
          path: |
            ./apps/studio/.astro
            ./apps/studio/node_modules/.astro
            ./apps/studio/node_modules/.cache
          key: ${{ runner.os }}-astro-${{ hashFiles('apps/studio/package-lock.json', 'apps/studio/src/content/**') }}
          restore-keys: |
            ${{ runner.os }}-astro-

      - name: 📥 패키지 설치 (npm ci)
        working-directory: ./apps/studio
        run: npm ci

      - name: 🏗️ Astro 사이트 빌드 (정적 HTML 렌더링)
        working-directory: ./apps/studio
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"
        run: npm run build

      - name: 🚀 빌드된 최종 산출물(dist)을 GitHub Pages 배포 준비 폴더로 업로드
        uses: actions/upload-pages-artifact@v3
        with:
          # apps/studio의 dist 안의 파일들만을 배포 타겟으로 지정합니다. 
          # (이 덕분에 루트 폴더의 파일들이 섞이지 않고 완벽히 격리됩니다.)
          path: ./apps/studio/dist

  deploy:
    name: "🌐 GitHub Pages로 라이브 배포"
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 🌍 전 세계에 릴리즈 (Deploy)
        id: deployment
        uses: actions/deploy-pages@v4
