<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FreshSelf - 신선한 공유 보관소 초대</title>
  <!-- Google Fonts 프리미엄 타이포그래피 이식 -->
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #10B981; /* FreshSelf 시그니처 에메랄드 */
      --bg: #111827;      /* 고급스러운 딥 다크 배경 */
      --text: #F3F4F6;
    }
    body {
      margin: 0; padding: 0;
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Outfit', 'Noto Sans KR', sans-serif;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      min-height: 100vh; text-align: center;
      box-sizing: border-box; padding: 24px;
    }
    .card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px; padding: 40px 24px;
      width: 100%; max-width: 380px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
    }
    .logo {
      width: 80px;
      height: 80px;
      border-radius: 24px; /* 앱의 둥근 사각형 규격(24dp) 맞춤 */
      margin-bottom: 24px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }
    h1 {
      font-size: 24px; font-weight: 800; margin: 0 0 12px 0;
    }
    p {
      font-size: 14px; color: rgba(243, 244, 246, 0.7);
      line-height: 1.6; margin: 0 0 32px 0;
    }
    .btn {
      display: block; background-color: var(--primary);
      color: #FFFFFF; text-decoration: none;
      font-weight: 700; padding: 16px;
      border-radius: 14px; font-size: 16px;
      transition: transform 0.2s, background-color 0.2s;
    }
    .btn:active {
      transform: scale(0.97);
      background-color: #059669;
    }
  </style>
</head>
<body>
  <div class="card">
    <!-- 공식 브랜드 아이콘 이식 완료 -->
    <img src="/freshself/invite/icon.png" alt="FreshSelf Logo" class="logo">
    <h1>FreshSelf 공유 공간 초대</h1>
    <p>식료품과 모든 보관 아이템을 가장 신선할 때!<br>가족, 룸메이트와 함께 보관소를 공동 관리해 보세요.</p>
    <!-- 구글 플레이 스토어로 이동하는 설치 다운로드 버튼 -->
    <a href="https://play.google.com/store/apps/details?id=com.selalink.freshself" class="btn">
      앱 다운로드하고 참여하기
    </a>
    <!-- 인앱 브라우저 호환성을 위한 클립보드 복사 버튼 (에메랄드 테마 테두리 스타일) -->
    <button id="copyBtn" class="btn" style="margin-top: 12px; background-color: rgba(16, 185, 129, 0.1); border: 1px solid var(--primary); color: var(--primary); cursor: pointer; width: 100%; border-radius: 14px; padding: 16px; font-weight: 700; font-size: 16px; box-sizing: border-box;">
      초대 링크 직접 복사하기
    </button>
  </div>

  <script>
    const currentUrl = window.location.href;

    // 인앱 브라우저 및 일반 모바일 브라우저 클립보드 복사 우회 솔루션
    function copyToClipboard(text) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        return navigator.clipboard.writeText(text);
      } else {
        return new Promise((resolve, reject) => {
          const textarea = document.createElement('textarea');
          textarea.value = text;
          // 가상 키보드 방지 및 투명도 0
          textarea.style.position = 'fixed';
          textarea.style.top = '0';
          textarea.style.left = '0';
          textarea.style.opacity = '0';
          document.body.appendChild(textarea);
          textarea.focus();
          textarea.select();
          try {
            const successful = document.execCommand('copy');
            document.body.removeChild(textarea);
            if (successful) {
              resolve();
            } else {
              reject(new Error('execCommand copy failed'));
            }
          } catch (err) {
            document.body.removeChild(textarea);
            reject(err);
          }
        });
      }
    }

    // 터치 이벤트를 통한 복사 실행 (사용자 제스처 확보)
    const copyBtn = document.getElementById('copyBtn');
    copyBtn.addEventListener('click', () => {
      copyToClipboard(currentUrl).then(() => {
        alert('초대 코드가 클립보드에 안전하게 복사되었습니다!\n\n앱을 켜고 [공간] 탭 ➡️ [초대 링크/메시지로 입장] 화면에서 [붙여넣기]를 누르면 즉시 합류됩니다! 🪄');
      }).catch(err => {
        alert('자동 복사에 실패했습니다.\n주소창의 링크를 직접 복사해 주세요.');
      });
    });

    // 백그라운드 자동 복사도 혹시 모를 브라우저를 위해 시도하되 콘솔 경고만 기록
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(currentUrl).then(() => {
        console.log('초대 코드가 클립보드에 자동 보존되었습니다.');
      }).catch(err => {
        console.warn('초대 코드 자동 복사 무시됨 (수동 버튼 클릭 필요):', err);
      });
    }
  </script>
</body>
</html>
